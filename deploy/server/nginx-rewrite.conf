# R2保护扩展：专用 server 块内的 include 片段，教程 docs/server-deployment.md。
# 其他实例需修改下面的 public 路径；不得将整个程序目录作为公开根目录。
# Include only from the dedicated img.d3ling.cn virtual host.
client_max_body_size 100m;
location ^~ /.well-known/acme-challenge/ {
    root /www/wwwroot/d3ling-imgbed/public;
    try_files $uri =404;
}
location ^~ / {
    proxy_pass http://127.0.0.1:7658;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header X-Imgbed-Hosting baota always;
}
